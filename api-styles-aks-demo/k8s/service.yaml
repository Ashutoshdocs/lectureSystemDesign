apiVersion: v1
kind: Service
metadata:
  name: api-styles-demo-lb
  labels:
    app: api-styles-demo
spec:
  type: LoadBalancer          # Azure provisions a public Standard Load Balancer
  selector:
    app: api-styles-demo
  ports:
    - name: http              # REST / GraphQL / WebSocket / SOAP / Webhooks
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: grpc              # gRPC over HTTP/2 (L4 passthrough, works fine)
      port: 50051
      targetPort: 50051
      protocol: TCP
