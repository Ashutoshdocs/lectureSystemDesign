apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-styles-demo
  labels:
    app: api-styles-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-styles-demo
  template:
    metadata:
      labels:
        app: api-styles-demo
    spec:
      containers:
        - name: api-styles-demo
          # __IMAGE__ is substituted by scripts/03-deploy.sh (sed).
          # e.g. apistylesacr12345.azurecr.io/api-styles-demo:v1
          image: __IMAGE__
          ports:
            - name: http          # REST / GraphQL / WebSocket / SOAP / Webhooks
              containerPort: 3000
            - name: grpc          # gRPC (HTTP/2)
              containerPort: 50051
          env:
            - name: HTTP_PORT
              value: "3000"
            - name: GRPC_PORT
              value: "50051"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
